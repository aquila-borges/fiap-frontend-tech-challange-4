<div class="expense-filters">
  <div class="expense-filters__field">
    <label for="category-filter">Categoria</label>
    <select id="category-filter" (change)="onCategoryChange($any($event.target).value)">
      <option value="">Todas</option>
      @for (category of categories(); track category) {
        <option [value]="category">{{ category }}</option>
      }
    </select>
  </div>

  <div class="expense-filters__field">
    <label for="account-filter">Conta</label>
    <select id="account-filter" (change)="onAccountChange($any($event.target).value)">
      <option value="">Todas</option>
      @for (account of accounts(); track account) {
        <option [value]="account">{{ account }}</option>
      }
    </select>
  </div>

  <div class="expense-filters__field">
    <label for="consolidated-filter">Consolidado</label>
    <select id="consolidated-filter" (change)="onConsolidatedChange($any($event.target).value)">
      <option value="">Todos</option>
      <option value="true">Sim</option>
      <option value="false">Não</option>
    </select>
  </div>
</div>
