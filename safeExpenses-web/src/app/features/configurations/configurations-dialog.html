<h2 mat-dialog-title>Configurações</h2>

<div mat-dialog-content>
  <div class="configurations-dialog__options">
    <mat-slide-toggle (change)="onWelcomeBannerChange($event.checked)">
      <span class="se-slide-toggle-title">Ativar banner de boas-vindas</span>
      <span class="se-slide-toggle-description">
        Exibe uma mensagem de boas-vindas personalizada com destaques rápidos sempre que o
        usuário abrir a área Home.
      </span>
    </mat-slide-toggle>
  </div>
</div>

<div mat-dialog-actions>
  <se-secondary-button (buttonClick)="cancel()">Cancelar</se-secondary-button>
  <se-primary-button (buttonClick)="save()">Salvar</se-primary-button>
</div>
